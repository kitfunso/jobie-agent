<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sample Co - Senior Data Engineer</title>
</head>
<body>
<div id="app"></div>

<template id="tpl-posting">
  <!-- mirrors edftrading.wd1: h2 header, apply link, location as dl/dt/dd with an icon-only aria-hidden sibling -->
  <div data-automation-id="jobDetails">
    <h2 data-automation-id="jobPostingHeader">Senior Data Engineer</h2>
    <a data-automation-id="adventureButton" href="#apply">Apply</a>
    <div data-automation-id="locations"><div aria-hidden="true"></div><dl><dt>locations</dt><dd>London, United Kingdom</dd></dl></div>
    <div data-automation-id="jobPostingDescription">
      <p>We are looking for a Senior Data Engineer to own our freight and pricing data pipelines.</p>
      <p>You will build and run Python and SQL jobs against a multi-terabyte lake and cut error rates through better reconciliation.</p>
      <p>Experience with cloud data warehouses and a production on-call rotation is expected.</p>
    </div>
  </div>
</template>

<template id="tpl-info">
  <div data-automation-id="contactInformationPage">
    <label for="firstName">First name</label>
    <input id="firstName" data-automation-id="legalNameSection_firstName" type="text">
    <label for="lastName">Last name</label>
    <input id="lastName" data-automation-id="legalNameSection_lastName" type="text">
    <label for="addressLine1">Address line 1</label>
    <input id="addressLine1" data-automation-id="addressSection_addressLine1" type="text">
    <label for="city">City</label>
    <input id="city" data-automation-id="addressSection_city" type="text">
    <label for="postalCode">Postal code</label>
    <input id="postalCode" data-automation-id="addressSection_postalCode" type="text">
    <button type="button" aria-haspopup="listbox" data-automation-id="addressSection_countryRegion" aria-controls="country-list">Select country</button>
    <label for="phoneNumber">Phone number</label>
    <input id="phoneNumber" data-automation-id="phone-number" type="text">
    <button type="button" aria-haspopup="listbox" data-automation-id="phone-device-type" aria-controls="phone-type-list">Select phone type</button>
  </div>
</template>

<template id="tpl-experience">
  <div data-automation-id="myExperiencePage">
    <div data-automation-id="file-upload-drop-zone">
      <input type="file" multiple data-automation-id="file-upload-input-ref">
      <div id="upload-list"></div>
    </div>
    <!-- guess: Appendix A has no source for a Workday cover letter field on this step -->
    <textarea data-automation-id="coverLetter"></textarea>
  </div>
</template>

<template id="tpl-review">
  <div>
    <h2>Review</h2>
    <p>Check your application before you submit it.</p>
  </div>
</template>

<script>
(function () {
  var step = new URLSearchParams(location.search).get("step");
  var tplId = { info: "tpl-info", experience: "tpl-experience", review: "tpl-review" }[step] || "tpl-posting";
  document.getElementById("app").appendChild(document.getElementById(tplId).content.cloneNode(true));

  // Footer as on Workday: one button id on every step, reading "Save and Continue" until the Review page, where it reads "Submit".
  var NEXT = { info: "experience", experience: "review" };
  if (NEXT[step] || step === "review") {
    var footer = document.createElement("div");
    footer.setAttribute("data-automation-id", "bottom-navigation");
    var btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("data-automation-id", "bottom-navigation-next-button");
    btn.textContent = step === "review" ? "Submit" : "Save and Continue";
    btn.addEventListener("click", function () {
      document.body.dataset.clicked = btn.textContent;
      if (step === "review") { document.body.dataset.submitted = "1"; return; }
      var first = document.getElementById("firstName");
      if (first && !first.value) {
        var err = document.createElement("div");
        err.setAttribute("data-automation-id", "errorMessage");
        err.textContent = "First Name is required";
        footer.parentElement.insertBefore(err, footer);
        return;
      }
      setTimeout(function () { location.search = "?step=" + NEXT[step]; }, 200);
    });
    footer.appendChild(btn);
    document.getElementById("app").appendChild(footer);
  }

  function initDropdown(button, listId, options) {
    button.addEventListener("click", function () {
      var openList = document.getElementById(listId);
      if (openList) { openList.parentElement.remove(); return; }
      var popup = document.createElement("div");
      popup.setAttribute("data-automation-widget", "wd-popup");
      var ul = document.createElement("ul");
      ul.id = listId;
      ul.setAttribute("role", "listbox");
      options.forEach(function (text) {
        var li = document.createElement("li");
        li.textContent = text;
        li.setAttribute("role", "option");
        li.addEventListener("click", function () { button.textContent = text; popup.remove(); });
        ul.appendChild(li);
      });
      popup.appendChild(ul);
      document.body.appendChild(popup);
    });
  }

  var countryButton = document.querySelector('[data-automation-id="addressSection_countryRegion"]');
  if (countryButton) initDropdown(countryButton, "country-list", ["United Kingdom", "United States", "Germany"]);

  var phoneButton = document.querySelector('[data-automation-id="phone-device-type"]');
  if (phoneButton) initDropdown(phoneButton, "phone-type-list", ["Mobile", "Home"]);

  var fileInput = document.querySelector('[data-automation-id="file-upload-input-ref"]');
  if (fileInput) {
    fileInput.addEventListener("change", function () {
      var list = document.getElementById("upload-list");
      list.innerHTML = "";
      Array.prototype.forEach.call(fileInput.files, function (f) {
        var row = document.createElement("div");
        row.setAttribute("data-automation-id", "file-upload-successful");
        row.textContent = f.name;
        list.appendChild(row);
      });
    });
  }
})();
</script>
</body>
</html>
