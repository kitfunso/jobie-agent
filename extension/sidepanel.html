<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>jobie-agent</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<div id="status" class="status" hidden></div>

<section id="server">
  <p id="server-status">Server: checking...</p>
</section>

<section id="settings">
  <h2>Settings</h2>
  <label for="provider">Provider</label>
  <select id="provider">
    <option value="bedrock">bedrock</option>
    <option value="anthropic">anthropic</option>
    <option value="openai">openai</option>
  </select>
  <label for="api-key">API key</label>
  <input id="api-key" type="password" autocomplete="off">
  <label for="model-id">Model id</label>
  <input id="model-id" type="text">
  <label for="region">Region (bedrock only)</label>
  <input id="region" type="text" placeholder="us-east-1">
  <button id="save-settings">Save</button>
</section>

<section id="profile">
  <h2>Profile</h2>
  <label for="first-name">First name</label>
  <input id="first-name" type="text">
  <label for="last-name">Last name</label>
  <input id="last-name" type="text">
  <label for="email">Email</label>
  <input id="email" type="text">
  <label for="phone">Phone</label>
  <input id="phone" type="text">
  <label for="country">Country</label>
  <input id="country" type="text">
  <label for="city">City</label>
  <input id="city" type="text">
  <label for="linkedin">LinkedIn</label>
  <input id="linkedin" type="text">
  <button id="save-profile">Save</button>
</section>

<section id="cv">
  <h2>CV</h2>
  <input id="cv-file" type="file" accept="application/pdf,.pdf">
  <p id="cv-info">No CV loaded.</p>
</section>

<section id="posting">
  <h2>Posting</h2>
  <button id="read-posting">Read this posting</button>
  <label for="posting-title">Title</label>
  <input id="posting-title" type="text">
  <label for="posting-company">Company</label>
  <input id="posting-company" type="text">
  <label for="posting-location">Location</label>
  <input id="posting-location" type="text">
  <label for="posting-description">Description</label>
  <textarea id="posting-description" rows="6"></textarea>
</section>

<section id="tailor">
  <h2>Tailor</h2>
  <button id="tailor-btn">Tailor CV and write letter</button>
  <div id="rounds"></div>
  <label for="letter-text">Cover letter</label>
  <textarea id="letter-text" rows="8"></textarea>
  <label for="cv-markdown">CV (markdown)</label>
  <textarea id="cv-markdown" rows="10"></textarea>
  <h3>Changes</h3>
  <ul id="changes-list"></ul>
  <h3>Gaps</h3>
  <ul id="gaps-list"></ul>
  <p>
    <a id="cv-pdf-link" href="#" target="_blank" hidden>CV PDF</a>
    <a id="letter-pdf-link" href="#" target="_blank" hidden>Letter PDF</a>
  </p>
</section>

<section id="apply">
  <h2>Apply</h2>
  <button id="fill-btn">Fill this page</button>
  <button id="run-btn">Run to review</button>
  <button id="stop-btn">Stop</button>
  <p class="note">Run to review fills each page, presses Save and Continue, and stops at the Review page or as soon as a page needs you. jobie-agent never presses Submit.</p>
  <ul id="run-log"></ul>
  <div id="fill-results"></div>
</section>

<script src="sidepanel.js"></script>
</body>
</html>
